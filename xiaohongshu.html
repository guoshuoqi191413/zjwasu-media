<body>
<div class="app">
<aside>
<div class="brand">
<img src="logo-wasu.png" class="brandLogo" alt="华数">
<span class="brandText">浙江华数小红书<br>数据驾驶舱</span>
</div>
<nav>
<button class="selected" data-target="xhs-overview">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="7" height="9"/>
<rect x="14" y="3" width="7" height="5"/>
<rect x="14" y="12" width="7" height="9"/>
<rect x="3" y="16" width="7" height="5"/>
</svg>数据总览</button>
<button data-target="xhs-trend-section">
<svg viewBox="0 0 24 24">
<path d="M3 3v18h18M7 15l4-5 3 3 4-6"/>
</svg>年度趋势</button>
<button data-target="xhs-top-section">
<svg viewBox="0 0 24 24">
<path d="M4 19V9m6 10V4m6 15v-7m4 7H2"/>
</svg>TOP内容</button>
<button data-target="xhs-content">
<svg viewBox="0 0 24 24">
<path d="M3 3h18v18H3M3 9h18M9 3v18"/>
</svg>内容表现</button>
</nav>
</aside>
<main>
<header>
<div class="account">
<img src="logo-video.png" class="videoIcon" alt="">运营数据</div>
</header>
<div class="page">
<div class="titleRow">
<h1>小红书数据总览</h1>
</div>
<div class="platformRail">
<a href="index.html">视频号</a>
<a class="active" href="xiaohongshu.html">小红书</a>
<span class="soon">抖音号</span>
<span class="soon">公众号</span>
</div>
<section id="xhs-overview">
<div class="xhsMetrics" id="xhsMetrics">
</div>
<div class="xhsGrid">
<div class="panel xhsChart">
<div class="panelHead">
<h2>阅读趋势</h2>
<span id="xhsDateRange">
</span>
</div>
<div id="xhsTrend" style="width:100%;flex:1;min-height:280px">
</div>
</div>
<div class="panel xhsTop" id="xhs-top-section">
<div class="panelHead">
<h2>数据 TOP 内容</h2>
<span>按阅读量</span>
</div>
<div class="xhsTopList" id="xhsTopList">
</div>
</div>
</div>
</section>
<section id="xhs-trend-section">
<div class="panel yearPanel">
<div class="panelHead">
<h2>年度阅读趋势</h2>
<div class="yearHeadActions">
<span>按发布日期归入对应年份</span>
<select id="xhsYear">
<option value="all">历年对比</option>
<option value="2026">2026年</option>
<option value="2025">2025年</option>
<option value="2024">2024年</option>
<option value="2023">2023年</option>
</select>
</div>
</div>
<div id="xhsYearChart" style="width:100%;height:300px">
</div>
</div>
</section>
<section id="xhs-content">
<div class="panel xhsTable">
<div class="panelHead">
<h2>内容表现</h2>
<span id="xhsCount">
</span>
</div>
<div class="xhsFilters">
<input id="xhsSearch" placeholder="搜索标题关键词">
<select id="xhsFilterYear">
<option value="all">全部年份</option>
<option>2026</option>
<option>2025</option>
<option>2024</option>
<option>2023</option>
</select>
</div>
<div class="tableWrap">
<table>
<thead>
<tr>
<th>内容</th>
<th>发布时间</th>
<th>阅读量</th>
<th>互动量</th>
<th>评论</th>
<th>点赞</th>
<th>收藏</th>
<th>分享</th>
</tr>
</thead>
<tbody id="xhsBody">
</tbody>
</table>
</div>
<div class="xhsPager" id="xhsPager">
</div>
</div>
</section>
</div>
</main>
</div>
<script src="echarts.min.js">
</script>
<script src="xhs-data.js?v=20260901-data1">
</script>
<script src="xhs-app.js?v=20260901-data1">
</script>
<script src="platform-trend-modal.js?v=20260821-1">
</script>
<script src="platform-top-modal.js?v=20260821-1">
</script>
<script src="platform-nav-scroll.js?v=20260821-7">
</script>
</body>
</html>
